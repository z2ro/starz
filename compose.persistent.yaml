name: starz-persistent-universe
services:
  universe-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: universe
      POSTGRES_USER: universe
      POSTGRES_PASSWORD: universe_local_only
    ports: ["127.0.0.1:5545:5432"]
    volumes: ["universe-save:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universe -d universe"]
      interval: 2s
      timeout: 3s
      retries: 30
  universe-app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://universe:universe_local_only@universe-db:5432/universe
      STARZ_PERSISTENT: "1"
      STARZ_UNIVERSE_SEED: STARZ-PERSISTENT
    ports: ["127.0.0.1:8030:8000"]
    depends_on:
      universe-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  universe-save:
