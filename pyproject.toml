[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starz"
version = "0.1.0"
description = "StarZ browser strategy vertical slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["starz*"]
