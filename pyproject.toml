[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starz"
version = "0.1.0"
description = "StarZ browser strategy vertical slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["starz*"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
