services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starz}
      POSTGRES_USER: ${POSTGRES_USER:-starz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starz_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - starz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-starz}:${POSTGRES_PASSWORD:-starz_dev_only}@postgres:5432/${POSTGRES_DB:-starz}
      STARZ_UNIVERSE_SEED: ${STARZ_UNIVERSE_SEED:-STARZ-ALPHA}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  starz_postgres_data:
